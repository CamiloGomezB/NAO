// Repo NAO: arranque y paro de la carrera (reglas 2.7, 3.2.3 y 3.2.5).
// lane y startMode los reescribe la ventana de despliegue para cada robot.
lane = rl;
startMode = buttonOnly;
maxRunMs = 180000;           // regla 3.2.5: 3 minutos por carrera
whistleArmDelayMs = 2000;    // silbatos de justo despues de armar se ignoran
minWhistleConfidence = 0.3;  // correlacion de WhistleRecognizer
tapMinMs = 40;
tapMaxMs = 800;
abortHoldMs = 500;           // boton trasero: desactivacion manual (sensor que no esta en las piernas)
chestStopHoldMs = 300;       // pecho mantenido corriendo: tambien detiene (paro de robot/race_nao.py)
laneToggleHoldMs = 2000;     // boton delantero mantenido esperando: RL <-> B-Human
unstiffHoldMs = 1000;        // tres botones de la cabeza: articulaciones sueltas
speak = true;
