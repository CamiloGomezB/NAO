// Repo NAO: vision de carril (carril/lane_estimator_puro.py). lightLine sale de config/pista_robot.json.
periodMs = 100;              // 10 FPS, como el entrenamiento
useCalibratedIntrinsics = true;
requireStableMatrix = false;
lightLine = false;           // false = cinta oscura sobre piso claro (polaridad "oscura")
colorMode = false;           // modo "color" de config/pista_robot.json; la ventana escribe estos tres valores
colorAxis = {x = 0; y = 0; z = 0;};
colorMean = {x = 0; y = 0; z = 0;};
laneWidth = 0.70;            // regla 3.2.4
lineWidth = 0.019;
rowStep = 4;
darkRatio = 0.62;
minContrast = 10.0;
relContrast = 0.18;
localWindow = 41;
xMin = 0.12;
xMax = 2.2;
maxAbsY = 1.6;
ransacIterations = 60;
inlierTol = 0.02;
minInliers = 8;
maxLines = 4;
pairTol = 0.08;
redRatio = 2.0;
redMin = 80;
redMinSat = 70;
redMinRowPx = 25;
redMinRows = 3;
