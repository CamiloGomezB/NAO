// Repo NAO: marcha RL. policy y vxCmd los reescribe la ventana de despliegue para cada robot.
policy = "rl_v1.2.1";
vxCmd = 0;                   // 0 = el vx_cmd recomendado de la politica
interpolationMs = 1500;      // de la postura actual a la pose home
settleMs = 500;              // en home antes de arrancar (entrenamiento: 0.5 s de pie)
psiWindowMs = 500;           // psi de pie para el rumbo objetivo (paso 58c)
maxTilt = 0.6;               // rad (robot/race_nao.py --fall-tilt)
maxLegTemperature = 75;      // grados C de un motor de pierna
stiffness = 100;             // contrato v1
